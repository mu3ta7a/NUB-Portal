<html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>
	NUB Portal | Login
</title><link href="Themes/Login/fonts/font-awesome-4.0.3/css/font-awesome.min.css" rel="stylesheet" type="text/css"><link rel="stylesheet" href="Themes/Login/bootstrap/css/bootstrap.css" type="text/css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
           
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
        }

        body {
            overflow-x: hidden;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            background: #f5f7fb;
             width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
        }

        /* =========================
           LEFT SIDE
        ========================= */

        .login-visual {
            width: 55%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient( 135deg, rgba(7, 30, 60, .94), rgba(7, 30, 60, .55) ), url('Themes/Login/img/1.jpg');
            background-size: cover;
            background-position: center;
        }

            .login-visual::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient( circle at 20% 20%, rgba(203,153,5,.30), transparent 30% );
            }

        .visual-content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 70px;
            color: #fff;
        }

        .visual-logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin-bottom: 35px;
            background: rgba(255,255,255,.96);
            padding: 15px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .visual-content h1 {
            font-size: 52px;
            font-weight: 700;
            margin: 0 0 18px;
            letter-spacing: .5px;
        }

            .visual-content h1 span {
                color: #d4a617;
            }

        .visual-content p {
            max-width: 620px;
            font-size: 18px;
            line-height: 1.8;
            color: rgba(255,255,255,.88);
            margin: 0;
        }

        .visual-line {
            width: 75px;
            height: 4px;
            background: #d4a617;
            border-radius: 10px;
            margin: 25px 0;
        }

        .university-info {
            margin-top: 45px;
            display: flex;
            gap: 35px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,.8);
            font-size: 14px;
        }

            .info-item i {
                color: #d4a617;
                font-size: 18px;
            }

        /* =========================
           RIGHT SIDE
        ========================= */
        .login-area {
    width: 45%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 35px;
}

.login-cards {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.login-card {
    width: 100%;
    background: #fff;
    border-radius: 25px;
    padding: 25px 35px;
    box-shadow: 0 25px 70px rgba(15, 35, 65, .12);
    border: 1px solid rgba(15,35,65,.05);
}
       

        .staff-card {
    padding-top: 18px;
    padding-bottom: 18px;
}

.staff-card .divider {
    margin-top: 0;
    margin-bottom: 14px;
}

.staff-card .staff-section {
    margin-top: 0;
}

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            color: #092744;
            font-size: 28px;
            font-weight: 700;
        }

        .card-header p {
            margin: 8px 0 0;
            color: #8993a4;
            font-size: 14px;
        }

        /* =========================
           INPUTS
        ========================= */

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

            .input-group-custom i {
                position: absolute;
                left: 17px;
                top: 50%;
                transform: translateY(-50%);
                color: #9ca7b5;
                z-index: 5;
            }

            .input-group-custom .form-control {
                width: 100%;
                height: 54px;
                border-radius: 12px;
                border: 1px solid #e1e6ed;
                padding-left: 45px;
                font-size: 15px;
                box-shadow: none;
                transition: .25s;
            }

                .input-group-custom .form-control:focus {
                    border-color: #0b426e;
                    box-shadow: 0 0 0 4px rgba(11,66,110,.08);
                }

            .input-group-custom label {
                display: block;
                color: #26384d;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
            }

        /* =========================
           BUTTONS
        ========================= */

        .btn-main {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient( 135deg, #092744, #0d527f );
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            transition: .3s;
            box-shadow: 0 8px 20px rgba(9,39,68,.18);
            cursor: pointer;
        }

            .btn-main:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 25px rgba(9,39,68,.25);
                color: #fff;
            }

        .btn-sso {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #dce3ea;
            color: #23364b;
            font-size: 15px;
            font-weight: 600;
            transition: .3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-top: 12px;
        }

            .btn-sso:hover {
                background: #f7f9fc;
                border-color: #bfcbd8;
                color: #092744;
                text-decoration: none;
                transform: translateY(-1px);
            }

            .btn-sso i {
                margin-right: 10px;
                color: #0b527f;
            }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #a0a9b5;
            font-size: 12px;
        }

            .divider::before,
            .divider::after {
                content: "";
                height: 1px;
                background: #e8ebef;
                flex: 1;
            }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 991px) {
            .login-page {
                display: block;
            }
            .login-visual {
                width: 100%;
                min-height: 300px;
                background-position: center;
            }
            .visual-content {
                height: 300px;
                padding: 35px;
            }
            .visual-logo {
                width: 65px;
                height: 65px;
                padding: 8px;
                margin-bottom: 15px;
            }
            .visual-content h1 {
                font-size: 32px;
            }
            .visual-content p,
            .university-info {
                display: none;
            }
            .login-area {
                width: 100%;
                min-height: auto;
                padding: 30px 20px;
            }
            .login-cards {
                max-width: 520px;
            }
            .login-card {
                max-width: none;
            }
        }
    </style>

</head>

<body>

    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" id="form1" autocomplete="off">

        <div class="login-page">

            <!-- LEFT VISUAL SECTION -->
            <section class="login-visual">
                <div class="visual-content">
                    <img src="Themes/Login/img/logo.png" class="visual-logo" alt="NUB Logo">
                    <h1>Welcome to <span>NUB</span></h1>
                    <div class="visual-line"></div>
                    <p>NUB is an Egyptian private university founded by the presidential decree 253/2006...</p>
                    <div class="university-info">
                        <div class="info-item"><i class="fa fa-shield"></i> Secure Access</div>
                        <div class="info-item"><i class="fa fa-graduation-cap"></i> University Services</div>
                        <div class="info-item"><i class="fa fa-cloud"></i> Digital Portal</div>
                    </div>
                </div>
            </section>

            <!-- RIGHT LOGIN SECTION -->
            <section class="login-area">
             <div class="login-cards">

                <!-- CARD 1: LOGIN -->
                <div class="login-card">
                    <div class="card-header">
                        <img src="Themes/Login/img/logo.png" class="card-logo" alt="NUB Logo">
                        <h2>NUB Portal</h2>
                        <p>Sign in to access your account</p>
                    </div>

                    <!-- USERNAME -->
                    <div class="input-group-custom">
                        <label>Username</label>
                        <i class="fa fa-user"></i>
                        <input name="txtUserName" type="text" id="txtUserName" class="form-control" placeholder="Enter your username" autocomplete="off">
                    </div>

                    <!-- PASSWORD -->
                    <div class="input-group-custom">
                        <label>Password</label>
                        <i class="fa fa-lock"></i>
                        <input name="txtPassword" id="txtPassword" class="form-control" placeholder="Enter your password" type="password" autocomplete="off">
                    </div>

                    <!-- LOGIN NOW BUTTON -->
                    <button type="button" class="btn-main" onclick="window.location.href='dashboard.html';">Login Now</button>
                </div>

                <!-- CARD 2: STUDENT / PARENT -->
                <div class="login-card">
                    <div class="divider">STUDENT / PARENT LOGIN</div>
                    <a class="btn-sso" href="dashboard.html"><i class="fa fa-user"></i> Student Portal</a>
                </div>

             </div>
            </section>

        </div>

    </form>

</body></html>
