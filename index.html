<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUB Portal | Login</title>
    <link href="https://portal.nub.edu.eg/Themes/Login/fonts/font-awesome-4.0.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://portal.nub.edu.eg/Themes/Login/bootstrap/css/bootstrap.css" type="text/css">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100vh; font-family: "Segoe UI", Arial, sans-serif; background: #f5f7fb; overflow: hidden; }
        .login-page { min-height: 100vh; display: flex; width: 100%; }
        .login-visual { width: 55%; min-height: 100vh; position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(7, 30, 60, .94), rgba(7, 30, 60, .55) ), url('https://portal.nub.edu.eg/Themes/Login/img/1.jpg'); background-size: cover; background-position: center; }
        .visual-content { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 70px; color: #fff; }
        .visual-logo { width: 115px; height: 115px; object-fit: contain; margin-bottom: 35px; background: rgba(255,255,255,.96); padding: 15px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
        .visual-content h1 { font-size: 52px; font-weight: 700; margin: 0 0 18px; }
        .visual-content h1 span { color: #d4a617; }
        .visual-line { width: 75px; height: 4px; background: #d4a617; border-radius: 10px; margin: 25px 0; }
        .login-area { width: 45%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 35px; }
        .login-card { width: 100%; max-width: 480px; background: #fff; border-radius: 25px; padding: 35px; box-shadow: 0 25px 70px rgba(15, 35, 65, .12); }
        .card-logo { width: 75px; height: 75px; object-fit: contain; margin-bottom: 15px; }
        .form-control { width: 100%; height: 54px; border-radius: 12px; border: 1px solid #e1e6ed; padding-left: 45px; margin-bottom: 20px; font-size: 15px; }
        .btn-main { width: 100%; height: 52px; border: none; border-radius: 12px; background: linear-gradient(135deg, #092744, #0d527f); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        @media (max-width: 991px) { .login-visual { display: none; } .login-area { width: 100%; } }
    </style>
</head>
<body>
    <div class="login-page">
        <section class="login-visual">
            <div class="visual-content">
                <img src="https://portal.nub.edu.eg/Themes/Login/img/logo.png" class="visual-logo" alt="NUB Logo">
                <h1>Welcome to <span>NUB</span></h1>
                <div class="visual-line"></div>
                <p>NUB is an Egyptian private university founded by the presidential decree 253/2006...</p>
            </div>
        </section>
        <section class="login-area">
            <div class="login-card">
                <div style="text-align: center; margin-bottom: 25px;">
                    <img src="https://portal.nub.edu.eg/Themes/Login/img/logo.png" class="card-logo" alt="NUB Logo">
                    <h2 style="color: #092744; font-size: 24px; font-weight: 700; margin: 0;">NUB Portal</h2>
                    <p style="color: #8993a4; font-size: 13px; margin-top: 5px;">Sign in to access your account</p>
                </div>
                <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                    <div style="position: relative;">
                        <i class="fa fa-user" style="position: absolute; left: 17px; top: 18px; color: #9ca7b5;"></i>
                        <input type="text" class="form-control" placeholder="Enter your username" required style="padding-left: 45px;">
                    </div>
                    <div style="position: relative;">
                        <i class="fa fa-lock" style="position: absolute; left: 17px; top: 18px; color: #9ca7b5;"></i>
                        <input type="password" class="form-control" placeholder="Enter your password" required style="padding-left: 45px;">
                    </div>
                    <button type="submit" class="btn-main">Login Now</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
