<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUB Portal | Login</title>
<link href="https://portal.nub.edu.eg/Themes/Login/fonts/font-awesome-4.0.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="https://portal.nub.edu.eg/Themes/Login/bootstrap/css/bootstrap.css" type="text/css">
<style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; font-family: "Segoe UI", Arial, sans-serif; background: #f5f7fb; overflow-x: hidden; }
        .login-page { min-height: 100vh; display: flex; width: 100%; }
        .login-visual { width: 55%; min-height: 100vh; position: relative; overflow: hidden; background: linear-gradient( 135deg, rgba(7, 30, 60, .94), rgba(7, 30, 60, .55) ), url('https://portal.nub.edu.eg/Themes/Login/img/1.jpg'); background-size: cover; background-position: center; }
        .login-visual::before { content: ""; position: absolute; inset: 0; background: radial-gradient( circle at 20% 20%, rgba(203,153,5,.30), transparent 30% ); }
        .visual-content { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 70px; color: #fff; }
        .visual-logo { width: 115px; height: 115px; object-fit: contain; margin-bottom: 35px; background: rgba(255,255,255,.96); padding: 15px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
        .visual-content h1 { font-size: 52px; font-weight: 700; margin: 0 0 18px; letter-spacing: .5px; }
        .visual-content h1 span { color: #d4a617; }
        .visual-content p { max-width: 620px; font-size: 18px; line-height: 1.8; color: rgba(255,255,255,.88); margin: 0; }
        .visual-line { width: 75px; height: 4px; background: #d4a617; border-radius: 10px; margin: 25px 0; }
        .university-info { margin-top: 45px; display: flex; gap: 35px; }
        .info-item { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.8); font-size: 14px; }
        .info-item i { color: #d4a617; font-size: 18px; }
        
        .login-area { width: 45%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 35px; }
        .login-cards { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
        .login-card { width: 100%; background: #fff; border-radius: 25px; padding: 25px 35px; box-shadow: 0 25px 70px rgba(15, 35, 65, .12); border: 1px solid rgba(15,35,65,.05); }
        .card-header { text-align: center; margin-bottom: 25px; }
        .card-logo { width: 120px; height: auto; object-fit: contain; margin-bottom: 12px; }
        .card-header h2 { margin: 0; color: #092744; font-size: 26px; font-weight: 700; }
        .card-header p { margin: 6px 0 0; color: #8993a4; font-size: 13px; }
        
        .input-group-custom { position: relative; margin-bottom: 18px; }
        .input-group-custom i { position: absolute; left: 17px; top: 41px; color: #9ca7b5; z-index: 5; }
        .input-group-custom .form-control { width: 100%; height: 50px; border-radius: 12px; border: 1px solid #e1e6ed; padding-left: 45px; font-size: 15px; }
        .input-group-custom label { display: block; color: #26384d; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        
        .btn-main { width: 100%; height: 50px; border: none; border-radius: 12px; background: linear-gradient(135deg, #092744, #0d527f); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(9,39,68,.18); margin-top: 5px; }
        .btn-sso { width: 100%; height: 48px; border-radius: 12px; background: #fff; border: 1px solid #dce3ea; color: #23364b; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 10px; cursor: pointer; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #a0a9b5; font-size: 11px; }
        .divider::before, .divider::after { content: ""; height: 1px; background: #e8ebef; flex: 1; }

        @media (max-width: 991px) { 
            .login-page { display: block; height: auto; overflow: auto; } 
            .login-visual { width: 100%; min-height: 240px; background-position: center; } 
            .visual-content { height: 240px; padding: 25px; justify-content: flex-start; } 
            .visual-logo { width: 75px; height: 75px; padding: 8px; margin-bottom: 12px; border-radius: 16px; }
            .visual-content h1 { font-size: 28px; margin-bottom: 8px; } 
            .visual-line { width: 50px; height: 3px; margin: 12px 0; }
            .visual-content p, .university-info { display: none; } 
            .login-area { width: 100%; min-height: auto; padding: 20px 15px; } 
            .login-cards { max-width: 100%; }
            .login-card { padding: 22px 20px; border-radius: 20px; }
        }
</style>
</head>
<body>
    <form onsubmit="handleLogin(event);" id="form1" autocomplete="off">
        <div class="login-page">
            <section class="login-visual">
                <div class="visual-content">
                    <img src="https://portal.nub.edu.eg/Themes/Login/img/logo.png" class="visual-logo" alt="NUB Logo">
                    <h1>Welcome to <span>NUB</span></h1>
                    <div class="visual-line"></div>
                    <p>NUB is an Egyptian private university founded by the presidential decree 253/2006...</p>
                    <div class="university-info">
                        <div class="info-item"><i class="fa fa-shield"></i> Secure Access</div>
                        <div class="info-item"><i class="fa fa-graduation-cap"></i> University Services</div>
                        <div class="info-item"><i class="fa fa-cloud"></i> Digital Portal</div>
                    </div>
                </div>
            </section>
            <section class="login-area">
             <div class="login-cards">
                <div class="login-card">
                    <div class="card-header">
                        <img src="https://portal.nub.edu.eg/Themes/Login/img/logo.png" class="card-logo" alt="NUB Logo">
                        <h2>NUB Portal</h2>
                        <p>Sign in to access your account</p>
                    </div>
                    <div class="input-group-custom">
                        <label>Username</label>
                        <i class="fa fa-user"></i>
                        <input name="txtUserName" type="text" id="txtUserName" class="form-control" placeholder="Enter your username" autocomplete="off" required>
                    </div>
                    <div class="input-group-custom">
                        <label>Password</label>
                        <i class="fa fa-lock"></i>
                        <input name="txtPassword" id="txtPassword" class="form-control" placeholder="Enter your password" type="password" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn-main">Login Now</button>
                </div>
                <div class="login-card">
                    <div class="divider">STUDENT / PARENT LOGIN</div>
                    <a class="btn-sso" href="javascript:void(0);" onclick="alert('Please login using your Username and Password.');"><i class="fa fa-user"></i> Student Portal</a>
                </div>
             </div>
            </section>
        </div>
    </form>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // نمنع الصفحة تعمل ريفرش
            
            var user = document.getElementById('txtUserName').value.trim();
            var pass = document.getElementById('txtPassword').value.trim();
            
            // نمسح أي رسالة خطأ قديمة لو موجودة
            var oldError = document.getElementById('error-msg');
            if (oldError) {
                oldError.remove();
            }

            // نتأكد من اليوزر والباسورد بتوعك
            if (user === 'a.gomaa0015@nub.edu.eg' && pass === 'u5082ur') {
                // لو صح، يحولك على الصفحة الرئيسية
                window.location.href = 'dashboard.html';
            } else {
                // لو غلط، نكريت رسالة خطأ أصلية تحت زرار اللوجين
                var errorDiv = document.createElement('div');
                errorDiv.id = 'error-msg';
                errorDiv.style.color = '#c62828';
                errorDiv.style.background = '#fff1f1';
                errorDiv.style.border = '1px solid #ffd4d4';
                errorDiv.style.padding = '10px';
                errorDiv.style.marginTop = '15px';
                errorDiv.style.borderRadius = '10px';
                errorDiv.style.fontSize = '13px';
                errorDiv.style.textAlign = 'center';
                errorDiv.innerText = 'Invalid username or password';
                
                var btn = document.querySelector('.btn-main');
                btn.parentNode.insertBefore(errorDiv, btn.nextSibling);
            }
        }
    </script>
</body>
</html>
