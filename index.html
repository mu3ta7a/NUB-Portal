<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUB Portal | Login</title>
    <link href="https://portal.nub.edu.eg/Themes/Login/fonts/font-awesome-4.0.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://portal.nub.edu.eg/Themes/Login/bootstrap/css/bootstrap.css" type="text/css">
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f5f7fb; margin: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 480px; background: #fff; border-radius: 25px; padding: 35px; box-shadow: 0 25px 70px rgba(15, 35, 65, .12); }
        .form-control { width: 100%; height: 54px; border-radius: 12px; border: 1px solid #e1e6ed; padding-left: 15px; margin-bottom: 20px; font-size: 15px; }
        .btn-main { width: 100%; height: 52px; border: none; border-radius: 12px; background: linear-gradient(135deg, #092744, #0d527f); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>NUB Portal</h2>
        <p>Sign in to access your account</p>
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <label>Username</label>
            <input type="text" class="form-control" placeholder="Enter your username" required>
            <label>Password</label>
            <input type="password" class="form-control" placeholder="Enter your password" required>
            <button type="submit" class="btn-main">Login Now</button>
        </form>
    </div>
</body>
</html>
